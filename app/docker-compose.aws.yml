# ==============================================================================
# Production Docker Compose for AWS EC2 Instances
# Application Tier: React Frontend (Nginx) + Express Backend (Node.js)
# Database Tier: External Amazon RDS PostgreSQL (via private subnet)
# ==============================================================================

services:
  # 1. Express Backend REST API
  server:
    image: ${DOCKER_USERNAME:-agravi987}/devops-server:${IMAGE_TAG:-latest}
    container_name: aws_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      # Amazon RDS PostgreSQL Configuration
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-devops_db}
    ports:
      - "5000:5000"
    networks:
      - app_network

  # 2. React Frontend (Nginx Reverse Proxy on Port 80)
  client:
    image: ${DOCKER_USERNAME:-agravi987}/devops-client:${IMAGE_TAG:-latest}
    container_name: aws_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
