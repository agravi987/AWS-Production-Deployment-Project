# ==============================================================================
# Production Docker Compose for AWS EC2 Instances
# Application Tier: React Frontend + Express Backend
# Database Tier: Connects to external Amazon RDS PostgreSQL endpoint
# ==============================================================================

services:
  # 1. Express Backend REST API
  server:
    image: ${DOCKER_USERNAME}/devops-server:${IMAGE_TAG:-latest}
    container_name: aws_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      # Amazon RDS PostgreSQL Configuration
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "5000:5000"
    networks:
      - app_network

  # 2. React Frontend (Nginx Reverse Proxy)
  client:
    image: ${DOCKER_USERNAME}/devops-client:${IMAGE_TAG:-latest}
    container_name: aws_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
