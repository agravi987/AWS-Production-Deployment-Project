# ==============================================================================
# Nginx Configuration for React Frontend
# Serves static assets and acts as a reverse proxy for /api requests
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Root directory containing the built React files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Frontend Routing
    # If a requested file exists, serve it.
    # Otherwise, fall back to index.html (crucial for Single Page Applications)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend Reverse Proxy
    # Any request starting with /api/ is forwarded to the Express container
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
